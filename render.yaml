# Free demonstration: local documents and history reset when the service restarts.
services:
  - type: web
    name: folio-workspace
    runtime: docker
    plan: free
    repo: https://github.com/krunalzilpe/AI-FUSIONNEW
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: LLM_PROVIDER
        value: gemma
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: EMBEDDING_BACKEND
        value: onnx
